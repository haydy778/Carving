<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Māori Carving Zoom</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: sans-serif;
      overflow: hidden;
    }

    #carvingWrapper {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: black;
    }

    #carvingImage {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 100%;
      max-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: contain;
    }

    .marker {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid white;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .tooltip {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .marker:hover .tooltip {
      opacity: 1;
    }

    #storyText {
      position: absolute;
      bottom: 20px;
      left: 20px;
      max-width: 40%;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 10px;
      color: white;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="carvingWrapper">
    <img id="carvingImage" src="LowRes.png" alt="Māori Carving" />
    <div id="storyText"></div>
  </div>

  <script>
    const carvingImage = document.getElementById("carvingImage");
    const carvingWrapper = document.getElementById("carvingWrapper");
    const storyText = document.getElementById("storyText");

    const stories = [
      { title: "Don G. Grant", text: "Don G. Grant’s contribution to the school and community." },
      { title: "School Values", text: "This part embodies school values." },
      { title: "Ranginui", text: "Ranginui the Sky Father watches from above." }
    ];

    // Replace with your image's actual size
    const originalImageSize = {
      width: 2400,
      height: 3000
    };

    const markerPositions = [
      { x: 1200, y: 2200 }, // Don G. Grant
      { x: 1200, y: 300 },  // School Values
      { x: 1200, y: 100 }   // Ranginui
    ];

    function createMarkers() {
      markerPositions.forEach((pos, i) => {
        const marker = document.createElement("div");
        marker.className = "marker";

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.innerText = stories[i].title;
        marker.appendChild(tooltip);

        marker.addEventListener("click", () => {
          storyText.innerHTML = `<h2>${stories[i].title}</h2><p>${stories[i].text}</p>`;
        });

        carvingWrapper.appendChild(marker);
      });

      updateAllMarkerPositions();
    }

    function updateAllMarkerPositions() {
      const imageRect = carvingImage.getBoundingClientRect();
      const markers = document.querySelectorAll(".marker");

      markers.forEach((marker, i) => {
        const pos = markerPositions[i];
        const scaleX = imageRect.width / originalImageSize.width;
        const scaleY = imageRect.height / originalImageSize.height;

        const x = imageRect.left + pos.x * scaleX;
        const y = imageRect.top + pos.y * scaleY;

        marker.style.left = `${x}px`;
        marker.style.top = `${y}px`;
      });
    }

    window.addEventListener("resize", updateAllMarkerPositions);
    carvingImage.onload = createMarkers;
  </script>

</body>
</html>
